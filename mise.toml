[tools]
java = "temurin-17"
python = "3.12"
uv = "latest"
[tasks]
install = { run = "uv sync --all-packages", description = "Install API dependencies" }
"dev:api" = { run = ".venv/bin/python -m uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8000", description = "Run Camp Room API" }
"android:build" = { run = "bash apps/pleos/gradlew -p apps/pleos :app:assembleDemoDebug", description = "Build native demo APK" }
