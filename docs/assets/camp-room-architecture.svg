<g class="link" data-layer="server" data-from="API" data-to="DB"><path class="edge" d="M927 908V1018"/><text x="927" y="969" class="edge-label" text-anchor="middle">저장 · 캐시</text></g>
<g class="link" data-layer="server" data-from="API" data-to="GoCamping"><path class="edge" d="M742 868H550V931H312"/><text x="433" y="919" class="edge-label" text-anchor="middle">캠핑장 · 사진</text></g>
<g class="link" data-layer="server" data-from="API" data-to="KMA"><path class="edge" d="M742 884H670V1077H312"/><text x="491" y="1065" class="edge-label" text-anchor="middle">단기예보</text></g>
