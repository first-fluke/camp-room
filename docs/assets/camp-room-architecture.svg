<g id="node-UI" class="node" data-node="UI" data-layer="app" tabindex="0" role="button" aria-label="Compose 화면"><title>생명주기에 맞춰 StateFlow를 수집하고 사용자 입력을 전달합니다. 준비 카드는 로컬 저장소도 직접 사용합니다.</title><rect x="62" y="164" width="280" height="110" rx="15" fill="#ffffff" stroke="#b6c9e4"/>
<text x="202.0" y="200" class="node-title" text-anchor="middle">Compose 화면</text>
<text x="202.0" y="227" class="node-detail" text-anchor="middle">찾기 · 내 캠핑 · 차박</text>
</g>
<g id="node-VM" class="node" data-node="VM" data-layer="app" tabindex="0" role="button" aria-label="CampViewModel"><title>서버 요청과 차량 SDK 요청을 조정합니다. 전면 실행·CarUx 사용 허용·요청 세션을 확인합니다.</title><rect x="402" y="164" width="280" height="110" rx="15" fill="#ffffff" stroke="#b6c9e4"/>
<text x="542.0" y="200" class="node-title" text-anchor="middle">CampViewModel</text>
<text x="542.0" y="227" class="node-detail" text-anchor="middle">StateFlow · Hilt</text>
</g>
<g id="node-Client" class="node" data-node="Client" data-layer="app" tabindex="0" role="button" aria-label="CampRepository"><title>생성된 DefaultApi와 Ktor/OkHttp로 캠핑장·날씨·여행 API를 호출합니다.</title><rect x="742" y="164" width="370" height="110" rx="15" fill="#ffffff" stroke="#b6c9e4"/>
<text x="927.0" y="200" class="node-title" text-anchor="middle">CampRepository</text>
<text x="927.0" y="227" class="node-detail" text-anchor="middle">OpenAPI 생성 클라이언트</text>
<text x="927.0" y="251" class="node-detail" text-anchor="middle">Ktor · OkHttp</text>
</g>
<g id="node-Local" class="node" data-node="Local" data-layer="app" tabindex="0" role="button" aria-label="SharedPreferences"><title>준비 카드와 식사 체크 화면이 앱 내부에 저장합니다. 이 준비 상태의 Turso 동기화 경로는 없습니다.</title><rect x="62" y="354" width="280" height="110" rx="15" fill="#ffffff" stroke="#b6c9e4"/>
<text x="202.0" y="390" class="node-title" text-anchor="middle">SharedPreferences</text>
<text x="202.0" y="417" class="node-detail" text-anchor="middle">준비 단계 · 준비물 · 식사</text>
<text x="202.0" y="441" class="node-detail" text-anchor="middle">다음 여행 목록</text>
</g>
<g id="node-SDK" class="node" data-node="SDK" data-layer="app" tabindex="0" role="button" aria-label="PlatformBridge · Pleos SDK"><title>ViewModel이 전달한 허용 조건과 세션을 확인해 차량·내비 SDK를 호출합니다. 차량 연동은 차량 내 SDK를 직접 사용합니다.</title><rect x="402" y="354" width="710" height="110" rx="15" fill="#ffffff" stroke="#b6c9e4"/>
<text x="757.0" y="390" class="node-title" text-anchor="middle">PlatformBridge · Pleos SDK</text>
<text x="757.0" y="417" class="node-detail" text-anchor="middle">차량 상태 · 위치 · 경로 미리보기 · 음성</text>
<text x="757.0" y="441" class="node-detail" text-anchor="middle">전면 실행 · 사용 허용 · 세션 확인</text>
</g>
<g id="node-Edge" class="node" data-node="Edge" data-layer="server" tabindex="0" role="button" aria-label="Cloudflare"><title>camp-room-api.firstfluke.com의 HTTPS 요청을 API 서버에 연결하는 배포 구성입니다.</title><rect x="742" y="582" width="370" height="100" rx="15" fill="#ffffff" stroke="#b9d2ca"/>
<text x="927.0" y="618" class="node-title" text-anchor="middle">Cloudflare</text>
<text x="927.0" y="645" class="node-detail" text-anchor="middle">HTTPS · Tunnel</text>
</g>
<g id="node-API" class="node" data-node="API" data-layer="server" tabindex="0" role="button" aria-label="FastAPI · CampService"><title>캠핑장·날씨·여행 API와 관리 API를 제공합니다. 공급자 처리와 데이터 저장을 서버에서 수행합니다.</title><rect x="742" y="798" width="370" height="110" rx="15" fill="#ffffff" stroke="#b9d2ca"/>
<text x="927.0" y="834" class="node-title" text-anchor="middle">FastAPI · CampService</text>
<text x="927.0" y="861" class="node-detail" text-anchor="middle">공급자 어댑터 · 저장소</text>
</g>
<g id="node-DB" class="node" data-node="DB" data-layer="server" tabindex="0" role="button" aria-label="Turso"><title>같은 관계형 스키마를 사용하며, 설정에 따라 Turso 또는 로컬 SQLite를 선택합니다.</title><rect x="742" y="1018" width="370" height="110" rx="15" fill="#ffffff" stroke="#b9d2ca"/>
<text x="927.0" y="1054" class="node-title" text-anchor="middle">Turso</text>
<text x="927.0" y="1081" class="node-detail" text-anchor="middle">여행 정보 · 공급자 캐시</text>
<text x="927.0" y="1105" class="node-detail" text-anchor="middle">개발 환경: 로컬 SQLite 선택</text>
</g>
<g id="node-GoCamping" class="node" data-node="GoCamping" data-layer="server" tabindex="0" role="button" aria-label="고캠핑"><title>서버 GoCampingAdapter가 캠핑장 정보와 사진을 조회합니다.</title><rect x="62" y="886" width="250" height="90" rx="15" fill="#ffffff" stroke="#b9d2ca"/>
<text x="187.0" y="922" class="node-title" text-anchor="middle">고캠핑</text>
<text x="187.0" y="949" class="node-detail" text-anchor="middle">캠핑장 · 사진</text>
</g>
<g id="node-KMA" class="node" data-node="KMA" data-layer="server" tabindex="0" role="button" aria-label="기상청"><title>서버 KmaAdapter가 캠핑장 위치와 일정에 맞는 단기예보를 조회합니다.</title><rect x="62" y="1032" width="250" height="90" rx="15" fill="#ffffff" stroke="#b9d2ca"/>
<text x="187.0" y="1068" class="node-title" text-anchor="middle">기상청</text>
<text x="187.0" y="1095" class="node-detail" text-anchor="middle">단기예보</text>
</g>
<g id="node-Admin" class="node" data-node="Admin" data-layer="ops" tabindex="0" role="button" aria-label="Next.js 관리자 BFF"><title>관리자 화면에서 운영 정보를 확인하고 관리 API로 요청을 전달합니다.</title><rect x="62" y="602" width="250" height="80" rx="15" fill="#ffffff" stroke="#c9bfdf"/>
<text x="187.0" y="631" class="node-title" text-anchor="middle">Next.js 관리자 BFF</text>
<text x="187.0" y="658" class="node-detail" text-anchor="middle">세션 인증 · 관리 API</text>
</g>
<g id="node-Worker" class="node" data-node="Worker" data-layer="ops" tabindex="0" role="button" aria-label="Python 갱신 워커"><title>HTTP 스케줄링을 담당하며 공급자 조회와 저장은 API에 맡깁니다. 일회 또는 주기 실행을 선택합니다.</title><rect x="62" y="704" width="250" height="70" rx="15" fill="#ffffff" stroke="#c9bfdf"/>
<text x="187.0" y="733" class="node-title" text-anchor="middle">Python 갱신 워커</text>
