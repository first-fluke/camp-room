<rect x="32" y="552" width="310" height="242" rx="22" fill="#f5f3fb" stroke="#ded7ee"/><text x="56" y="587" class="group-title">어드민</text>
<rect x="712" y="744" width="436" height="190" rx="22" fill="#f1f6fc" stroke="#cddbeb"/><text x="736" y="779" class="group-title">API 서버 · Docker</text>
<rect x="32" y="836" width="310" height="312" rx="22" fill="#eff8f4" stroke="#cae5d8"/><text x="56" y="871" class="group-title">외부 데이터 공급자</text>
<g class="link" data-layer="app" data-from="UI" data-to="VM"><path class="edge" d="M342 218H402" marker-start="url(#arrow)"/><text x="372" y="150" class="edge-label" text-anchor="middle">상태 · 입력</text></g>
<g class="link" data-layer="app" data-from="VM" data-to="Client"><path class="edge" d="M682 218H742"/><text x="712" y="150" class="edge-label" text-anchor="middle">조회 · 여행 저장</text></g>
<g class="link" data-layer="app" data-from="UI" data-to="Local"><path class="edge" d="M202 274V354"/><text x="202" y="318" class="edge-label" text-anchor="middle">준비 상태 저장</text></g>
<g class="link" data-layer="app" data-from="VM" data-to="SDK"><path class="edge" d="M542 274V354"/><text x="542" y="318" class="edge-label" text-anchor="middle">사용 허용 · 세션 확인</text></g>
<g class="link" data-layer="server" data-from="Client" data-to="Edge"><path class="edge" d="M1112 218H1130V550H927V582"/><text x="1020" y="567" class="edge-label" text-anchor="middle">HTTPS · JSON</text></g>
