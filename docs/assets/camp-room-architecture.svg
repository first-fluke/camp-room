<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1220" viewBox="0 0 1180 1220" role="img" aria-labelledby="title desc">
<title id="title">캠프룸 아키텍처</title>
<desc id="desc">Pleos 앱의 화면과 ViewModel, 서버 API 연결, 로컬 준비 상태 저장, 차량 SDK 직접 연결, 서버의 데이터 공급자와 저장소, 별도 운영 도구를 나타낸다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#17263d}.title{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748b}.group-title{font-size:18px;font-weight:650}.node-title{font-size:22px;font-weight:700}.node-detail{font-size:17px;fill:#485b72}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.edge.optional{stroke-dasharray:7 5}.edge-label{font-size:16px;fill:#475569;paint-order:stroke;stroke:#fafbfe;stroke-width:7px;stroke-linejoin:round}.node rect{stroke-width:1.5}.node{cursor:pointer}.node.selected rect{stroke:#e48a28;stroke-width:3}.faded{opacity:.18}.link{transition:opacity .15s}.node{transition:opacity .15s}</style>
