<text x="72" y="371" class="label">지역 · 날짜 · 인원</text>
<text x="72" y="414" class="label">차박 · 시설 필터</text>
<text x="72" y="457" class="label">조건 선택 → 검색 실행</text>
<text x="56" y="522" class="group">캠핑장 목록</text>
<text x="72" y="565" class="label">내 주변 정렬 · 페이지 이동</text>
<text x="72" y="608" class="label">사진 · 상세 열기</text>
<text x="56" y="673" class="group">캠핑장 상세 · 대화상자</text>
<text x="72" y="716" class="label">정보 · 시설 · 이용 수칙</text>
