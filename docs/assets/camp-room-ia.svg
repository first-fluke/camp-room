<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1580" viewBox="0 0 1500 1580" role="img" aria-labelledby="title desc">
<title id="title">캠프룸 화면 구조와 주요 이동 경로</title>
<desc id="desc">찾기, 내 캠핑, 차박의 세 상위 메뉴와 화면 내부 기능, 공통 대화상자, 메뉴 사이 이동을 나타낸 정보 구조도입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#59736a"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#173c31} .label{font-size:31px} .group{font-size:34px;font-weight:700} .muted{fill:#53665e} .white{fill:#fff;font-weight:700}</style>
<rect width="1500" height="1580" fill="#ffffff"/>
<rect x="520" y="26" width="460" height="76" rx="14" fill="#194e3e"/>
