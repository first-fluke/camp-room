<text x="546" y="1226" class="label">수량 · 삭제 · 수령 정보</text>
<text x="546" y="1269" class="label">배송 견적 미리보기</text>
<rect x="1010" y="1132" width="460" height="180" rx="14" fill="#f3f1e9" stroke="#d8d4c7" stroke-width="2"/>
<text x="1036" y="1180" class="group">언어 설정</text>
<text x="1036" y="1226" class="label">시스템 기본 · 한국어 · 영어</text>
<text x="1036" y="1269" class="label">선택한 언어로 화면 표시</text>
<rect x="30" y="1347" width="1440" height="170" rx="14" fill="#edf5f0" stroke="#c6d8cf" stroke-width="2"/>
<text x="56" y="1391" class="group">주요 화면 이동</text>
<text x="56" y="1437" class="label">찾기 상세 → 내 캠핑     ·     장소·일정 변경 → 찾기</text>
<text x="56" y="1480" class="label">여행 준비 → 차박     ·     차박에서 준비 이어가기 → 내 캠핑</text>
<text x="750" y="1554" class="muted" text-anchor="middle" style="font-size:27px">카드·선택 영역은 각 메뉴에서 사용하며, 대화상자를 닫으면 원래 화면으로 돌아갑니다.</text>
</svg>
