<rect x="520" y="202" width="460" height="860" rx="14" fill="#f7faf8" stroke="#c6d8cf" stroke-width="2"/>
<rect x="520" y="202" width="460" height="74" rx="14" fill="#27634f"/>
<text x="750" y="253" class="white" text-anchor="middle" style="font-size:40px">내 캠핑</text>
<rect x="1010" y="202" width="460" height="860" rx="14" fill="#f7faf8" stroke="#c6d8cf" stroke-width="2"/>
<rect x="1010" y="202" width="460" height="74" rx="14" fill="#27634f"/>
<text x="1240" y="253" class="white" text-anchor="middle" style="font-size:40px">차박</text>
