<text x="1052" y="522" class="label">짐 정리 · 함께 쉬기</text>
<text x="1052" y="565" class="label">독서와 휴식 · 취침 · 출발</text>
<text x="1036" y="630" class="group">설정 미리보기</text>
<text x="1052" y="673" class="label">지원 기능 요청</text>
