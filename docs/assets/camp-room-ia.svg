<text x="562" y="996" class="label">준비물 상품 → 장바구니</text>
<text x="562" y="1039" class="label">주문 내역 · 저장 내역이 있을 때</text>
<text x="1036" y="328" class="group">차량 상태</text>
<text x="1052" y="371" class="label">배터리 · 실내 온도</text>
<text x="1052" y="414" class="label">연결 · 구역 · 확인 시각</text>
