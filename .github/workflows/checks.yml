name: Camp Room checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv sync --all-packages --frozen
      - run: .venv/bin/python -m pytest apps/api/tests apps/worker/tests -q
      - run: .venv/bin/python scripts/review-database.py
      - run: .venv/bin/python apps/api/scripts/export_openapi.py --check
      - run: python apps/pleos/verify_contracts.py
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: bash apps/pleos/gradlew -p apps/pleos :app:assembleDemoDebug :app:assemblePleosDebug
