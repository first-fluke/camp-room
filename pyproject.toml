[project]
name = "camp-room-workspace"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker/src"]
testpaths = ["apps/api/tests", "apps/worker/tests"]
