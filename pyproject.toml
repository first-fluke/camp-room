[project]
name = "camp-room-workspace"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
